serverFiles:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "rules/*.yml"
    
    scrape_configs:
      - job_name: 'webset-miner'
        static_configs:
          - targets: ['app:9090']
        metrics_path: '/health/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s
    
      - job_name: 'postgres'
        static_configs:
          - targets: ['db:5432']
        metrics_path: '/metrics'
        scrape_interval: 30s
    
      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']
        metrics_path: '/metrics'
        scrape_interval: 30s
    
      - job_name: 'celery-workers'
        static_configs:
          - targets: ['worker:8000']
        metrics_path: '/metrics'
        scrape_interval: 30s
    
      - job_name: 'qdrant'
        static_configs:
          - targets: ['qdrant:6333']
        metrics_path: '/metrics'
        scrape_interval: 30s
    
      - job_name: 'weaviate'
        static_configs:
          - targets: ['weaviate:8080']
        metrics_path: '/v1/metrics'
        scrape_interval: 30s
    
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
  rules:
    key-metrics.yml: |
      # Alerting rules for key Websets metrics
      ---
      groups:
      - name: WebsetsKeyMetrics
        rules:
        - alert: HighRequestLatency
          expr: websets_http_request_duration_seconds_bucket{le="1"} / websets_http_requests_total > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High request latency"
            description: "More than 10% of requests are taking longer than 1s"
        - alert: HighErrorRate
          expr: rate(websets_http_requests_total{status_code!~"2.."}[5m]) / rate(websets_http_requests_total[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High HTTP error rate"
            description: "Over 5% of requests are failing"
        - alert: SLOErrorBudgetBurn
          expr: slo_error_budget_burn_rate{tier="1"} > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SLO burn rate high"
            description: "Error budget is burning faster than expected"
    slo-recording.yml: |
      # Recording rules for Websets SLO metrics
      ---
      groups:
      - name: WebsetsSLOs
        rules:
        - record: slo_availability
          expr: 1 - (rate(websets_http_requests_total{status_code!~"2.."}[5m]) / rate(websets_http_requests_total[5m]))
        - record: slo_latency_p95
          expr: histogram_quantile(0.95, sum(rate(websets_http_request_duration_seconds_bucket[5m])) by (le))
        - record: slo_error_budget_burn_rate
          expr: (1 - slo_availability) / (1 - 0.999)
