apiVersion: apps/v1
kind: Deployment
metadata:
  name: websets-green
  labels:
    app: websets
    version: green
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: websets
      version: green
  template:
    metadata:
      labels:
        app: websets
        version: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: websets
        image: ghcr.io/websets/websets:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
