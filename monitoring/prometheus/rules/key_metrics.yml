# Alerting rules for key Websets metrics
---
groups:
- name: WebsetsKeyMetrics
  rules:
  - alert: HighRequestLatency
    expr: websets_http_request_duration_seconds_bucket{le="1"} / websets_http_requests_total > 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High request latency"
      description: "More than 10% of requests are taking longer than 1s"
      runbook: ../../docs/runbooks/alerts.md#high-request-latency
  - alert: HighErrorRate
    expr: rate(websets_http_requests_total{status_code!~"2.."}[5m]) / rate(websets_http_requests_total[5m]) > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High HTTP error rate"
      description: "Over 5% of requests are failing"
      runbook: ../../docs/runbooks/alerts.md#high-error-rate
  - alert: SLOErrorBudgetBurn
    expr: slo_error_budget_burn_rate{tier="1"} > 2
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "SLO burn rate high"
      description: "Error budget is burning faster than expected"
      runbook: ../../docs/runbooks/alerts.md#slo-error-budget-burn
  - alert: JobFailureRate
    expr: rate(websets_jobs_total{status="failed"}[5m]) / rate(websets_jobs_total[5m]) > 0.1
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "High job failure rate"
      description: "More than 10% of jobs are failing"
      runbook: ../../docs/runbooks/alerts.md#job-failure-rate
  - alert: HighCPUUsage
    expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage above 90% on node"
      runbook: ../../docs/runbooks/alerts.md#resource-exhaustion
  - alert: DiskSpaceExhaustion
    expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Disk usage above 90%"
      description: "Disk usage above 90% on node"
      runbook: ../../docs/runbooks/alerts.md#resource-exhaustion
