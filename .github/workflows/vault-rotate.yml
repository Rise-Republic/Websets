name: Vault Secret Rotation

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly rotation

jobs:
  rotate-minio-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hvac
        run: pip install hvac
      - name: Validate Vault Access
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: python scripts/test_vault.py
      - name: Rotate MinIO Secrets and Update Vault
        run: bash scripts/rotate_minio_secrets.sh
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      - name: Notify Services
        run: |
          # Example webhook notification
          curl -X POST ${{ secrets.NOTIFY_WEBHOOK }} -d '{"event":"minio-secrets-rotated"}'
