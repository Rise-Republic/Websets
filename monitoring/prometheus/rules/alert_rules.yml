 groups:
  - name: websets-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(websets_http_requests_total{status_code!~"2.."}[5m]) / rate(websets_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate"
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(websets_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency > 1s"
