apiVersion: v1
kind: Service
metadata:
  name: webset-miner
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/health/metrics"
    prometheus.io/port: "8000"
spec:
  selector:
    app: webset-miner-blue
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
