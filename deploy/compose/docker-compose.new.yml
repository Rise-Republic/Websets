version: '3.8'

services:
  web-ui:
    build:
      context: ../../apps/web-ui
      dockerfile: Dockerfile
      args:
        - VITE_WORKOS_CLIENT_ID=client_01HXRMBQ9BJ3E7QSTQ9X2PHVB7
        - VITE_WORKOS_REDIRECT_URI=http://localhost:3000/auth/workos/callback
        - VITE_API_BASE=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - websets-network

  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/websets
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - WORKOS_API_KEY_TEST=sk_test_dev_placeholder
      - WORKOS_CLIENT_ID_TEST=client_01HXRMBQ9BJ3E7QSTQ9X2PHVB7
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - OPENAI_API_KEY=sk-placeholder
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - websets-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=websets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - websets-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - websets-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    networks:
      - websets-network

volumes:
  postgres_data:
  minio_data:

networks:
  websets-network:
    driver: bridge
