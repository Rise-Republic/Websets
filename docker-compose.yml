version: '3.9'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics port
    environment:
      - DATABASE_URL
      - VAULT_ADDR
      - REDIS_URL=rediss://redis:6379
      - CELERY_BROKER_URL=rediss://redis:6379
      - CELERY_RESULT_BACKEND=rediss://redis:6379
      - QDRANT_URL=https://qdrant:6333
      - WEAVIATE_URL=https://weaviate:8080
      - MINIO_ENDPOINT=https://minio:9000
      - MINIO_CA_CERT=/certs/ca.crt
      - MINIO_CLIENT_CERT=/certs/app.crt
      - MINIO_CLIENT_KEY=/certs/app.key
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL
      - VAULT_ADDR
      - REDIS_URL=rediss://redis:6379
      - CELERY_BROKER_URL=rediss://redis:6379
      - CELERY_RESULT_BACKEND=rediss://redis:6379
      - QDRANT_URL=https://qdrant:6333
      - WEAVIATE_URL=https://weaviate:8080
      - MINIO_ENDPOINT=https://minio:9000
      - MINIO_CA_CERT=/certs/ca.crt
      - MINIO_CLIENT_CERT=/certs/app.crt
      - MINIO_CLIENT_KEY=/certs/app.key
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1g
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL
      - VAULT_ADDR
      - REDIS_URL=rediss://redis:6379
      - CELERY_BROKER_URL=rediss://redis:6379
      - CELERY_RESULT_BACKEND=rediss://redis:6379
      - QDRANT_URL=https://qdrant:6333
      - WEAVIATE_URL=https://weaviate:8080
      - MINIO_ENDPOINT=https://minio:9000
      - MINIO_CA_CERT=/certs/ca.crt
      - MINIO_CLIENT_CERT=/certs/app.crt
      - MINIO_CLIENT_KEY=/certs/app.key
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=webset_miner
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_INITDB_ARGS=--data-encryption
      - POSTGRES_ENCRYPTION_KEY_FILE=/run/secrets/postgres_encryption_key
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
    secrets:
      - postgres_password
      - postgres_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200 \
      -dev-tls-cert=/certs/vault.crt -dev-tls-key=/certs/vault.key -dev-tls-client-ca=/certs/ca.crt
    volumes:
      - ./certs:/certs:ro
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--tls-port", "6379", "--port", "0",
              "--tls-cert-file", "/certs/redis.crt",
              "--tls-key-file", "/certs/redis.key",
              "--tls-ca-cert-file", "/certs/ca.crt"]
    ports:
      - "6379:6379"
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "rediss://localhost:6379", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./certs:/certs:ro
    environment:
      - QDRANT_TLS_CERT=/certs/qdrant.crt
      - QDRANT_TLS_KEY=/certs/qdrant.key
      - QDRANT_TLS_CA=/certs/ca.crt
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  weaviate:
    image: semitechnologies/weaviate:1.21.0
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - TLS_CERTIFICATE=/certs/weaviate.crt
      - TLS_PRIVATE_KEY=/certs/weaviate.key
    volumes:
      - weaviate_data:/var/lib/weaviate
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "https://localhost:8080/v1/.well-known/ready", "--ca-certificate=/certs/ca.crt"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_SERVER_URL: https://minio:9000
      MINIO_BROWSER_REDIRECT_URL: https://localhost:9001
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
      MINIO_KMS_SECRET_KEY: "minio-key:file:///run/secrets/minio_kms_key"
      MINIO_SSE_MASTER_KEY: "sse-key:file:///run/secrets/minio_sse_master_key"
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
      - ./certs:/certs:ro
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_kms_key
      - minio_sse_master_key
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
  weaviate_data:
  vault_data:

secrets:
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  postgres_password:
    file: ./secrets/postgres_password
  postgres_encryption_key:
    file: ./secrets/postgres_encryption_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  minio_kms_key:
    file: ./secrets/minio_kms_key
  minio_sse_master_key:
    file: ./secrets/minio_sse_master_key
