apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websets-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websets
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: websets
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
