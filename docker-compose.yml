x-app-env: &app-env
  - DATABASE_URL
  - VAULT_ADDR=http://vault:8200
  - VAULT_TOKEN=root
  - REDIS_URL=rediss://redis:6379
  - CELERY_BROKER_URL=rediss://redis:6379
  - CELERY_RESULT_BACKEND=rediss://redis:6379
  - QDRANT_URL=https://qdrant:6333
  - WEAVIATE_URL=https://weaviate:8080
  - MINIO_ENDPOINT=https://minio:9000
  - MINIO_CA_CERT=/certs/ca.crt
  - MINIO_CLIENT_CERT=/certs/app.crt
  - MINIO_CLIENT_KEY=/certs/app.key

x-app-volumes: &app-volumes
  - ./app:/app/app
  - ./data:/app/data
  - ./certs:/certs:ro

x-service-common: &service-common
  build: .
  environment: *app-env
  volumes: *app-volumes
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    vault:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *service-common
    build: .
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.main:app",
              "--host", "0.0.0.0",
              "--port", "8001"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      # Required environment variables for app startup
      DATABASE_URL: "postgresql://postgres:changeme@db:5432/webset_miner"
      OPENAI_API_KEY: "sk-dev-openai-key-for-local-development-only-0123456789"
      # WorkOS AuthKit Configuration (Environment-aware)
      WORKOS_API_KEY_TEST: "sk_test_a2V5XzAxSkU0VEtXSFZNWjVSMVc5WU0wVlkyNk5OLHZvaHZmQ0oxQ3FSamcxS3g4YVIyMHJrblk"
      WORKOS_API_KEY_LIVE: "${WORKOS_API_KEY_LIVE:-}"
      WORKOS_CLIENT_ID_TEST: "client_01JE4TKWY9039H6QSH7XNZHQ6Q"
      WORKOS_CLIENT_ID_LIVE: "${WORKOS_CLIENT_ID_LIVE:-}"
      WORKOS_REDIRECT_URI: "http://localhost:8001/api/auth/callback"
      WORKOS_COOKIE_PASSWORD: "yvHkj2U4tkv+oYGZon1EDfQVtbb4ro9cabdEAV9YH9A="
      WORKOS_ENFORCE_MFA: "false"
      ENVIRONMENT: "development"
    depends_on:
      vault:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://127.0.0.1:8001/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  worker:
    <<: *service-common
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - DATABASE_URL=postgresql://postgres:changeme@db:5432/webset_miner
      - OPENAI_API_KEY=sk-dev-openai-key-for-local-development-only-0123456789
    depends_on:
      vault:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1g
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  beat:
    <<: *service-common
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - DATABASE_URL=postgresql://postgres:changeme@db:5432/webset_miner
      - OPENAI_API_KEY=sk-dev-openai-key-for-local-development-only-0123456789
    depends_on:
      vault:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=webset_miner
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_INITDB_ARGS=
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - ./certs:/certs:ro
    command: >
      vault server
      -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:8200
      -dev-plugin-dir=/vault/plugins
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "--quiet", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --tls-port 6379
      --port 0
      --tls-cert-file /certs/redis.crt
      --tls-key-file /certs/redis.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no
    volumes:
      - redis_data:/var/lib/redis/data
      - ./certs:/certs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "rediss://localhost:6379", "--cacert", "/certs/ca.crt", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5


  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./certs:/certs:ro
    environment:
      - QDRANT_TLS_CERT=/certs/qdrant.crt
      - QDRANT_TLS_KEY=/certs/qdrant.key
      - QDRANT_TLS_CA=/certs/ca.crt
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  weaviate:
    image: semitechnologies/weaviate:1.21.0
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - TLS_CERTIFICATE=/certs/weaviate.crt
      - TLS_PRIVATE_KEY=/certs/weaviate.key
    volumes:
      - weaviate_data:/var/lib/weaviate
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "https://localhost:8080/v1/.well-known/ready", "--ca-certificate=/certs/ca.crt"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_SERVER_URL: https://minio:9000
      MINIO_BROWSER_REDIRECT_URL: https://localhost:9001
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
      MINIO_SSE_MASTER_KEY: "sse-key:file:///run/secrets/minio_sse_master_key"
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
      - ./certs:/certs:ro
      - ./secrets/minio_root_user:/run/secrets/minio_root_user:ro
      - ./secrets/minio_root_password:/run/secrets/minio_root_password:ro
      - ./secrets/minio_kms_key:/run/secrets/minio_kms_key:ro
      - ./secrets/minio_sse_master_key:/run/secrets/minio_sse_master_key:ro
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/certs/ca.crt", "-f", "https://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512m

volumes:
  postgres_data:
  qdrant_data:
  weaviate_data:
  vault_data:
  redis_data:
