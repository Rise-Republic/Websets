name: Security Scans

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  security-scans:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit
        run: bandit -r app -x tests -lll

      - name: Run Safety
        run: safety check -r requirements.txt

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --config=.gitleaks.toml --no-git

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: --lockfile=package-lock.json

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Start test instance
        run: docker compose up -d app

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8001'


   validate-vault-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hvac
        run: pip install hvac
      - name: Validate Vault Secrets
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: python scripts/validate_vault_secrets.py
