name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Start Vault and seed secrets
      run: bash scripts/start_dev_vault.sh
      env:
        VAULT_ADDR: http://127.0.0.1:8200
        VAULT_TOKEN: root
        VAULT_SECRET_PATH: secret/websets
    - name: Verify Vault connectivity
      run: python scripts/test_vault.py
      env:
        VAULT_ADDR: http://127.0.0.1:8200
        VAULT_TOKEN: root
        VAULT_SECRET_PATH: secret/websets
    
    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
        CELERY_BROKER_URL: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379
        JWT_SECRET_KEY: test-secret-key-for-ci-that-is-long-enough
        OPENAI_API_KEY: test-openai-key
        ENVIRONMENT: testing
        VAULT_ADDR: http://127.0.0.1:8200
        VAULT_TOKEN: root
        VAULT_SECRET_PATH: secret/websets
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run frontend tests
      run: npm run test:coverage
    
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./coverage
        flags: frontend
        name: frontend-coverage

  security-scans:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit
        run: bandit -r app -x tests -lll

      - name: Run Safety
        run: safety check -r requirements.txt

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python and Node.js
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        npm ci
    - name: Start Vault and seed secrets
      run: bash scripts/start_dev_vault.sh
      env:
        VAULT_ADDR: http://127.0.0.1:8200
        VAULT_TOKEN: root
        VAULT_SECRET_PATH: secret/websets
    - name: Verify Vault connectivity
      run: python scripts/test_vault.py
      env:
        VAULT_ADDR: http://127.0.0.1:8200
        VAULT_TOKEN: root
        VAULT_SECRET_PATH: secret/websets
    
    - name: Build frontend
      run: npm run build
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        VAULT_ADDR: http://127.0.0.1:8200
