name: Build Test Deploy
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write
  deployments: write
  security-events: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      web-ui: ${{ steps.changes.outputs.web-ui }}
      worker-celery: ${{ steps.changes.outputs.worker-celery }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'app/**'
              - 'requirements*.txt'
              - 'Dockerfile'
            web-ui:
              - 'apps/web-ui/**'
              - 'src/**'
              - 'package*.json'
              - 'vite.config.ts'
              - 'tsconfig*.json'
            worker-celery:
              - 'services/worker-celery/**'
              - 'app/tasks/**'
            infrastructure:
              - 'infra/**'
              - 'k8s/**'
              - 'deploy/**'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api-gateway == 'true' ||
      needs.changes.outputs.web-ui == 'true' ||
      needs.changes.outputs.worker-celery == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            condition: ${{ needs.changes.outputs.api-gateway == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'api-gateway') }}
          - service: web-ui
            condition: ${{ needs.changes.outputs.web-ui == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'web-ui') }}
          - service: worker-celery
            condition: ${{ needs.changes.outputs.worker-celery == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'worker-celery') }}
    
    steps:
      - name: Checkout code
        if: ${{ matrix.condition }}
        uses: actions/checkout@v4

      - name: Run security scan
        if: ${{ matrix.condition }}
        uses: ./.github/actions/security-scan
        with:
          service-path: ${{ matrix.service == 'api-gateway' && 'app' || matrix.service == 'web-ui' && 'src' || 'services/worker-celery' }}
          scan-types: sast,container,deps,secrets
          severity-threshold: HIGH

  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: [changes, security-scan]
    if: |
      always() &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (needs.changes.outputs.api-gateway == 'true' ||
       needs.changes.outputs.web-ui == 'true' ||
       needs.changes.outputs.worker-celery == 'true' ||
       github.event_name == 'workflow_dispatch')
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            condition: ${{ needs.changes.outputs.api-gateway == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'api-gateway') }}
          - service: web-ui
            condition: ${{ needs.changes.outputs.web-ui == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'web-ui') }}
          - service: worker-celery
            condition: ${{ needs.changes.outputs.worker-celery == 'true' || github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'worker-celery') }}
    
    steps:
      - name: Checkout code
        if: ${{ matrix.condition }}
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: ${{ matrix.condition }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service
        if: ${{ matrix.condition }}
        uses: ./.github/actions/build-service
        with:
          service: ${{ matrix.service }}
          environment: ${{ github.event.inputs.environment || 'dev' }}
          registry: ghcr.io/${{ github.repository_owner }}
          push-image: ${{ github.event_name != 'pull_request' }}
          run-tests: true

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      success() &&
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push'
    environment:
      name: development
      url: https://dev.websets.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to development
        run: |
          echo "🚀 Deploying to development environment"
          # In real implementation, this would use kubectl, helm, or other deployment tools
          echo "kubectl apply -f k8s/ --namespace=websets-dev"
          echo "✅ Development deployment completed"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      success() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.websets.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          # In real implementation, this would use kubectl, helm, or other deployment tools
          echo "helm upgrade --install websets-staging deploy/helm/websets/ --namespace=websets-staging"
          echo "✅ Staging deployment completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      success() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'
    environment:
      name: production
      url: https://websets.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment"
          # In real implementation, this would use the production deployment workflow
          echo "Triggering production deployment workflow..."
          echo "✅ Production deployment initiated"

  notification:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [security-scan, build, deploy-dev, deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Notify build results
        run: |
          echo "## 🏗️ Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Dev**: ${{ needs.deploy-dev.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Staging**: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Production**: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Completed**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
