name: Disaster Recovery Drill

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d db redis vault app
          for i in {1..30}; do
            if curl -fsS http://localhost:8001/v1/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "App failed to start" >&2
          exit 1

      - name: Backup database
        run: ./scripts/backup_db.sh backup.sql

      - name: Teardown stack
        run: docker compose down -v

      - name: Start fresh stack
        run: docker compose up -d db redis vault app

      - name: Restore database
        run: ./scripts/restore_db.sh backup.sql
