# Prometheus configuration for scraping metrics
scrape_configs:
  - job_name: 'platform-services'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: .*
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
  - job_name: 'database'
    static_configs:
      - targets: ['db:5432']
