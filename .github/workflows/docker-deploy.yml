name: Build and Deploy

on:
  push:
    branches: [ main ]
    tags: ['v*.*.*']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENVIRONMENT: testing
        run: pytest -v

      - name: Run frontend tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/websets
            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
            IMAGE_TAG=${{ github.sha }} docker-compose up -d

      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/websets
            PROMETHEUS_URL=${PROMETHEUS_URL:-http://localhost:9090}
            ERROR_RATE=$(curl -sf "$PROMETHEUS_URL/api/v1/query" \
              --data-urlencode "query=rate(websets_http_requests_total{status_code!~\"2..\"}[5m]) / rate(websets_http_requests_total[5m])" \
              | jq -r '.data.result[0].value[1]' 2>/dev/null || echo "1")
            LATENCY=$(curl -sf "$PROMETHEUS_URL/api/v1/query" \
              --data-urlencode "query=histogram_quantile(0.95, sum(rate(websets_http_request_duration_seconds_bucket[5m])) by (le))" \
              | jq -r '.data.result[0].value[1]' 2>/dev/null || echo "10")
            ERROR_RATE_THRESHOLD=0.05
            LATENCY_THRESHOLD=1
            CURRENT_COLOR=$(kubectl get service webset-miner -o jsonpath='{.spec.selector.app}' | sed 's/webset-miner-//')
            PREVIOUS_COLOR=$([ "$CURRENT_COLOR" = "blue" ] && echo green || echo blue)
            failed=false
            if ! awk 'BEGIN{exit !(('$ERROR_RATE' < '$ERROR_RATE_THRESHOLD'))}'; then
              failed=true
            fi
            if ! awk 'BEGIN{exit !(('$LATENCY' < '$LATENCY_THRESHOLD'))}'; then
              failed=true
            fi
            if [ "$failed" = true ]; then
              ./scripts/blue_green_deploy.sh "$PREVIOUS_COLOR"
            fi
